plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    // mcvanillatweaks-1.21.1-<version>.jar: players can tell the Minecraft version from the file name.
    archivesName = "${mod_id}-${minecraft_version}"
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Dev only, never packaged: screenshots of the citizen screen filled with a sample citizen (./gradlew runPreview).
sourceSets {
    preview {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.findProperty('dev_neo_version') ?: project.neo_version

    runs {
        client {
            client()
        }
        // Dedicated server check (citizen names are server side): ./gradlew runServer, in its own folder.
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
        preview {
            client()
            sourceSet = sourceSets.preview
            // Opens each citizen page at the title screen and saves run/screenshots/citizen_*.png, then quits.
            systemProperty 'mcvanillatweaks.preview', 'true'
            // ./gradlew runPreview -Ponly=hut_field,townhall_ : only the captures whose name starts with one of these.
            systemProperty 'mcvanillatweaks.preview.only', project.findProperty('only') ?: ''
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.preview)
        }
    }
}
neoForge.addModdingDependenciesTo(sourceSets.preview)

// 'localRuntime': present when running the game from the dev environment, never exposed to dependents.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    previewCompileOnly.extendsFrom compileOnly
    previewRuntimeClasspath.extendsFrom localRuntime
}

def colonyJars = files(
        "libs/minecolonies-${minecolonies_version}.jar",
        "libs/structurize-${structurize_version}.jar",
        "libs/blockui-${blockui_version}.jar",
        "libs/domum-ornamentum-${domum_version}.jar",
        "libs/multipiston-${multipiston_version}.jar"
)

dependencies {
    // MineColonies, its required libraries and the optional MultiPiston: compiled against, never bundled.
    compileOnly colonyJars
    localRuntime colonyJars
    // Optional local voice integration for runClient; never bundled or required.
    localRuntime fileTree(dir: 'libs', include: ['minecolonies-voice-expanded-*.jar'])
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version          : minecraft_version,
            minecraft_version_range    : minecraft_version_range,
            neo_version                : neo_version,
            loader_version_range       : loader_version_range,
            minecolonies_version_range : minecolonies_version_range,
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_license                : mod_license,
            mod_version                : mod_version,
            mod_authors                : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    from('LICENSE') {
        rename { "LICENSE_${mod_id}" }
    }
    manifest {
        attributes(
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors,
        )
    }
}

// The GPL asks for the source next to the jar: ./gradlew sourceZip -> build/distributions/<jar name>-source.zip,
// to upload with each release. MineColonies' jars (libs/) are left out: players get them from MineColonies' pages.
tasks.register('sourceZip', Zip) {
    group = 'build'
    description = 'Packs the source code to publish next to the jar.'
    archiveBaseName = base.archivesName
    archiveClassifier = 'source'
    from(projectDir) {
        include 'src/**', 'gradle/**', 'build.gradle', 'settings.gradle', 'gradle.properties', 'gradlew', 'gradlew.bat',
                'LICENSE', 'README.md', 'CHANGELOG.md', 'docs/**', '.gitignore', '.gitattributes'
    }
}
tasks.named('build') {
    dependsOn 'sourceZip'
}

// Before handing out a jar: ./gradlew scanPersonalData looks for every word of personal-data-terms.txt (one per line,
// case ignored, # = comment; the file stays local and is never packed) in the names and bytes of every file of the
// jar and the source zip already in build/. Fails with the list of hits.
tasks.register('scanPersonalData') {
    group = 'verification'
    description = 'Checks that the jar and the source zip contain none of the words of personal-data-terms.txt.'
    mustRunAfter 'jar', 'sourceZip'
    def termsFile = file('personal-data-terms.txt')
    def archives = [tasks.named('jar').flatMap { it.archiveFile }, tasks.named('sourceZip').flatMap { it.archiveFile }]
    doLast {
        if (!termsFile.exists()) {
            throw new GradleException("No ${termsFile.name}: write the words to look for, one per line.")
        }
        def terms = termsFile.readLines('UTF-8').collect { it.trim() }.findAll { it && !it.startsWith('#') }
        // Compared as bytes: each UTF-8 byte becomes one ISO-8859-1 char, so binary files are searched too (both sides
        // lower-cased the same way, so accented words still match).
        def needles = terms.collectEntries { [(it): new String(it.toLowerCase().getBytes('UTF-8'), 'ISO-8859-1').toLowerCase()] }
        def hits = []
        archives.each { provider ->
            def archive = provider.get().asFile
            if (!archive.exists()) {
                throw new GradleException("${archive.name} is missing: run ./gradlew build first.")
            }
            new java.util.zip.ZipFile(archive).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (entry.directory) {
                        return
                    }
                    def text = new String(zip.getInputStream(entry).bytes, 'ISO-8859-1').toLowerCase()
                    def name = entry.name.toLowerCase()
                    needles.each { term, needle ->
                        if (text.contains(needle) || name.contains(term.toLowerCase())) {
                            hits << "${archive.name}: ${entry.name}: ${term}"
                        }
                    }
                }
            }
        }
        if (hits) {
            throw new GradleException("Personal data found:\n" + hits.join('\n'))
        }
        logger.lifecycle("No personal data in ${archives.collect { it.get().asFile.name }.join(' and ')} (${terms.size()} words).")
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
