modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Built on MineColonies, Structurize, BlockUI and Domum Ornamentum by the LDT Team."
logoFile="${mod_id}.png"
logoBlur=false
# Optional on both sides: players and servers without it (or with another version) still connect.
displayTest="IGNORE_ALL_VERSION"
description='''
Addon for MineColonies that redraws its windows as vanilla Minecraft screens.

- Citizen, town hall, hut and university screens, research trees, build tool, Architect's Cutter and every other MineColonies window, in the Minecraft Java style.
- A permanent HUD showing the resources your builders still need (pin a Resource Scroll with J).
- Beacon beams to find citizens, huts and graves.
- Your own citizen name lists (built-in French and international lists, or your own).

The screens are client side: every one can be switched off in the config (K). Custom citizen names also need the mod on the server (in single player, nothing more to do).
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecolonies"
    type="required"
    reason="This addon replaces MineColonies' windows and names its citizens."
    versionRange="${minecolonies_version_range}"
    ordering="AFTER"
    side="BOTH"
